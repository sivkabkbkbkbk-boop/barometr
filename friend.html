<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашение в друзья — Не18мнеуже</title>
<meta property="og:title" content="Приглашение в друзья в «Не18мнеуже»">
<meta property="og:description" content="Друг хочет с тобой подружиться и обмениваться своим состоянием. Нажми, чтобы принять.">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1726;color:#eef3f8;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:380px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .em{font-size:44px;letter-spacing:6px}
  h1{font-size:21px;margin:0}
  p{margin:0;color:#9fb1c5;font-size:14px}
  a.btn{display:block;width:100%;box-sizing:border-box;background:#eef3f8;color:#0d1726;text-decoration:none;font-weight:600;padding:13px 18px;border-radius:12px}
  a.btn.ghost{background:transparent;color:#eef3f8;border:1px solid rgba(238,243,248,.2)}
  small{color:#9fb1c5;font-size:12px}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="em">😊😐😣</div>
  <h1 id="h">Приглашение в «Не18мнеуже»</h1>
  <p id="t">Открываю приложение…</p>
</div>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1)), k=h.get("k"), n=h.get("n")||"", sc=h.get("s")||"";
  var box=document.getElementById("box");
  if(!k){ document.getElementById("t").textContent="В ссылке нет данных приглашения. Попросите друга отправить её ещё раз."; return; }
  var q="k="+encodeURIComponent(k)+"&n="+encodeURIComponent(n)+(sc?"&s="+encodeURIComponent(sc):"");
  if(h.get("r")==="1") q+="&r=1";
  var APK="https://github.com/sivkabkbkbkbk-boop/barometr-app/releases/latest/download/barometr.apk";
  // if the app is not installed, Chrome follows the fallback and the APK starts downloading at once
  var base=location.href.split("#")[0].split("?")[0];
  var ni=/[?&]ni=1/.test(location.search)||h.get("ni")==="1";   // we came back here: the app is not installed
  var back=base+"?ni=1#"+q;   // a different address, so the page really reloads
  // installed -> the app opens; not installed -> Chrome returns to this page with ni=1
  var intent="intent://friend?"+q+"#Intent;scheme=barometr;package=ru.barometr.neba;S.browser_fallback_url="+encodeURIComponent(back)+";end";
  var inviteUrl=base+"#"+q;
  var who=n?("<b>"+n.replace(/[<>&"]/g,"")+"</b>"):"Твой друг";
  document.title=(n?n.replace(/[<>&"]/g,""):"Друг")+" хочет с тобой подружиться";
  box.innerHTML='<div class="em">🤝🌦</div><h1>'+who+(h.get("r")==="1"?' принял(а) твоё приглашение в друзья</h1>':' хочет с тобой подружиться и обмениваться своим состоянием</h1>')+
    '<p>В «Не18мнеуже» вы будете видеть самочувствие друг друга, сравнивать его с погодой и переписываться.</p>'+
    (ni ? '<a class="btn" id="dl" href="'+APK+'">⬇️ Установить приложение</a><a class="btn ghost" href="'+intent.replace(/S\.browser_fallback_url=[^;]*;/,"")+'">Уже установил(а) — принять</a>'
        : '<a class="btn" href="'+intent+'">Принять приглашение</a><a class="btn ghost" id="dl" href="'+APK+'">⬇️ Скачать приложение для Android</a>')+
    '<a class="btn ghost" id="web" href="./">Открыть веб-версию</a>'+
    (ni ? '<small>Нажмите «Установить», откройте скачанный файл и разрешите установку. При первом запуске приложение само предложит принять приглашение.</small>'
        : '<small>Если приложения ещё нет — нажмите «Скачать». При первом запуске оно само предложит принять приглашение.</small>');
  var dl=document.getElementById("dl");
  if(dl) dl.addEventListener("click",function(){ try{ navigator.clipboard.writeText(inviteUrl); }catch(e){} });   // the app picks the invite up from the clipboard after installing
  document.getElementById("web").addEventListener("click",function(){ try{ localStorage.setItem("pendingFriend", location.href); }catch(e){} });
  if(/Android/i.test(navigator.userAgent) && !ni) setTimeout(function(){ location.href=intent; }, 300);
})();
</script>
</body>
</html>
