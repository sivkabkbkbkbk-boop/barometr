<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Метеодневник — вход</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1726;color:#eef3f8;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:center}
  h1{font-size:20px;margin:0}
  p{margin:0;color:#9fb1c5;font-size:14px}
  a.btn{display:inline-block;background:#eef3f8;color:#0d1726;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:12px}
  .ok{font-size:42px}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="ok">⏳</div>
  <h1>Подключаю Яндекс Диск…</h1>
</div>
<script>
// Yandex returns here after the user allows access: #access_token=...&state=app|web
(function(){
  var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  var token = h.get("access_token"), state = h.get("state") || q.get("state") || "app", err = h.get("error") || q.get("error");
  var box = document.getElementById("box");
  // the page may be opened again later (Back button, tab list) — the token of this visit is kept for a few minutes
  try{ if(token){ sessionStorage.setItem("mtdTok", JSON.stringify({t:token,s:state,at:Date.now()})); }
       else { var sv=JSON.parse(sessionStorage.getItem("mtdTok")||"null"); if(sv&&Date.now()-sv.at<10*60*1000){ token=sv.t; state=sv.s; } } }catch(e){}
  var openApp = "intent://open#Intent;scheme=barometr;package=ru.barometr.neba;end";
  if (!token) {
    box.innerHTML = '<div class="ok">⚠️</div><h1>Вход не завершён</h1><p>' + (err === "access_denied" ? "Доступ не был разрешён." : "Эта страница открыта без кода от Яндекса.") +
      '</p><p>Если приложение уже написало «Яндекс Диск подключён» — всё в порядке, эту вкладку можно закрыть. Если нет — вернитесь в «Метеодневник» и нажмите «Войти через Яндекс» ещё раз.</p><a class="btn" href="' + openApp + '">Открыть «Метеодневник»</a>';
    return;
  }
  history.replaceState(null, "", location.pathname);           // do not keep the token in the address bar
  if (state === "web") {
    try { var y = JSON.parse(localStorage.getItem("yandex") || "{}"); y.token = token; y.last = ""; localStorage.setItem("yandex", JSON.stringify(y)); } catch (e) {}
    location.replace("./");
    return;
  }
  var link = "barometr://auth?access_token=" + encodeURIComponent(token);
  var intent = "intent://auth?access_token=" + encodeURIComponent(token) + "#Intent;scheme=barometr;package=ru.barometr.neba;end";
  box.innerHTML = '<div class="ok">✅</div><h1>Готово</h1><p>Возвращаю в «Метеодневник». Если приложение не открылось само, нажмите кнопку.</p><a class="btn" href="' + intent + '">Вернуться в приложение</a>';
  setTimeout(function(){ location.href = intent; }, 150);
  setTimeout(function(){ location.href = link; }, 1500);
})();
</script>
</body>
</html>
